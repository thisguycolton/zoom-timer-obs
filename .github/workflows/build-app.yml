name: Build app

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick version
        run: |
          ref="${GITHUB_REF_NAME#v}"
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION=$ref" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi
      - name: Build
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZoomTimerBridge-${{ env.VERSION }}
          path: dist/ZoomTimerBridge-${{ env.VERSION }}.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/ZoomTimerBridge-${VERSION}.zip" --clobber
