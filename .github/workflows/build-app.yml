name: Build app

on:
  push:
    tags: ["v*"]
    branches: ["windows-bridge"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick version
        run: |
          ref="${GITHUB_REF_NAME#v}"
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION=$ref" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi
      - name: Build
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZoomTimerBridge-${{ env.VERSION }}
          path: dist/ZoomTimerBridge-${{ env.VERSION }}.zip
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/ZoomTimerBridge-${VERSION}.zip" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pick version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#v}"
          if [[ "$ref" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "VERSION=$ref" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi
      - name: Test and build
        shell: pwsh
        run: windows/build.ps1 -Version $env:VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: ZoomTimerBridge-Windows-${{ env.VERSION }}
          path: dist/ZoomTimerBridge-Windows-*.zip
      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ZoomTimerBridge-Windows-*.zip --clobber
