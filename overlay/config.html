<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer Overlay Setup</title>
<style>
  :root { color-scheme: dark; --bg: #16171a; --card: #202227; --line: #33363d; --muted: #9aa0a8; --accent: #2d8cff; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #eceef1; font: 14px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 18px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 14px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label, .two > * { min-width: 0; }
  input, select { width: 100%; background: #121316; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[type=color] { padding: 2px; height: 32px; width: 100%; }
  .check input { width: auto; }
  .check { display: flex; align-items: center; gap: 8px; color: #eceef1; font-size: 13px; }
  .preview { background: repeating-conic-gradient(#2a2c31 0 25%, #222428 0 50%) 0 0 / 24px 24px; border-radius: 10px; border: 1px solid var(--line); min-height: 420px; position: relative; }
  iframe { width: 100%; height: 100%; min-height: 420px; border: 0; background: transparent; color-scheme: normal; display: block; }
  .url { display: flex; gap: 8px; margin-top: 12px; }
  .url input { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .templates { display: flex; gap: 8px; margin-bottom: 12px; }
  .templates select { flex: 1; min-width: 0; }
  .templates button { white-space: nowrap; padding: 6px 10px; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: inherit; font-weight: 400; }
  button.ghost:disabled { opacity: .4; cursor: default; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Timer overlay setup</h1>
    <p>Pick a style, then paste the URL into an OBS Browser Source. The preview runs a fake 30 second timer.</p>
    <div class="templates">
      <select id="templates" aria-label="Templates"></select>
      <button type="button" id="saveTemplate">Save as template</button>
      <button type="button" id="deleteTemplate" class="ghost" title="Delete the selected template">Delete</button>
    </div>
    <form id="f">
      <label>Layout
        <select name="layout"><option value="bar">Time + progress bar</option><option value="ring">Progress ring</option><option value="text">Time only</option></select>
      </label>
      <label>Label above the time (optional)<input name="label" placeholder="e.g. Speaker time"></label>
      <div class="two">
        <label>Clock size (px)<input name="size" type="number" min="24" max="400" value="96"></label>
        <label>Font<input type="hidden" name="font"><div id="fontPicker"></div></label>
      </div>
      <div class="two">
        <label>Warn at (% left)<input name="warn" type="number" min="0" max="100" value="50"></label>
        <label>Danger at (% left)<input name="danger" type="number" min="0" max="100" value="20"></label>
      </div>
      <div class="two">
        <label>Plenty of time<input type="hidden" name="ok" data-color></label>
        <label>Warning<input type="hidden" name="warnColor" data-color></label>
        <label>Almost out<input type="hidden" name="dangerColor" data-color></label>
        <label>Time's up / over<input type="hidden" name="over" data-color></label>
        <label>Text<input type="hidden" name="text" data-color></label>
        <label>Panel<input type="hidden" name="panelColor" data-color></label>
        <label>Bar track<input type="hidden" name="track" data-color></label>
      </div>
      <div class="two">
        <label>Time's up text<input name="timesup" value="Time's up"></label>
        <label>Overtime text<input name="overtime" value="Over time"></label>
      </div>
      <label class="check"><input type="checkbox" name="blend"> Fade colors smoothly</label>
      <label class="check"><input type="checkbox" name="percent" checked> Show percentage</label>
      <label class="check"><input type="checkbox" name="panel" checked> Dark panel behind timer</label>
      <label class="check"><input type="checkbox" name="idle" checked> Show the set time before Start</label>
    </form>
  </section>
  <section>
    <div class="preview"><iframe id="preview" title="Preview"></iframe></div>
    <div class="url"><input id="url" readonly><button id="copy" type="button">Copy URL</button></div>
    <p style="margin-top:8px">In OBS: Sources › + › Browser, paste the URL, set width 800 and height 400. The helper must be running.</p>
  </section>
</main>
<script src="fontpicker.js"></script>
<script src="colorpicker.js"></script>
<script>
  const f = document.getElementById("f"), frame = document.getElementById("preview"), out = document.getElementById("url");
  const defaults = { layout: "bar", size: "96", warn: "50", danger: "20", ok: "#34c759", warnColor: "#ffcc00", dangerColor: "#ff3b30",
                     over: "#ff3b30", text: "#ffffff", panelColor: "rgba(0, 0, 0, 0.55)", track: "rgba(255, 255, 255, 0.18)",
                     timesup: "Time's up", overtime: "Over time", label: "", font: "" };
  const checkDefaults = { blend: false, percent: true, panel: true, idle: true };

  function build() {
    const q = new URLSearchParams();
    for (const el of f.elements) {
      if (!el.name) continue;
      if (el.type === "checkbox") {
        if (el.name === "blend" && el.checked) q.set("blend", "1");
        else if (el.name !== "blend" && !el.checked) q.set(el.name, "0");
        continue;
      }
      let v = el.value.trim();
      if (v === "" || v === defaults[el.name]) continue;
      if (el.name === "warn" || el.name === "danger") v = String(Math.min(100, Math.max(0, +v)) / 100);
      if (el.hasAttribute("data-color")) v = /^#[0-9a-f]{6}$/i.test(v) ? v.slice(1) : v.replace(/\s+/g, "");
      q.set(el.name, v);
    }
    const qs = q.toString();
    const base = location.origin.startsWith("http") ? location.origin : "http://127.0.0.1:17845";
    out.value = base + "/" + (qs ? "?" + qs : "");
    const demo = new URLSearchParams(q); demo.set("demo", "1");
    frame.src = "index.html?" + demo.toString();
    return qs;
  }

  // Font dropdown (installed fonts); it writes into the hidden "font" field that build() reads.
  const fontInput = f.elements.font;
  const fontPicker = FontPicker.create({
    value: fontInput.value, placeholder: "System default",
    onChange: (name) => { fontInput.value = name; build(); },
  });
  document.getElementById("fontPicker").appendChild(fontPicker.element);

  // Color pickers (with opacity); each writes into its hidden field.
  const colorPickers = {};
  f.querySelectorAll("input[data-color]").forEach((input) => {
    input.value = defaults[input.name];
    const picker = ColorPicker.create({
      value: input.value, allowEmpty: false,
      onChange: (v) => { input.value = v; clearTimeout(t); t = setTimeout(build, 120); },
    });
    colorPickers[input.name] = picker;
    input.after(picker.element);
  });

  /** Fills the form from a query string as build() writes it (missing values go back to defaults). */
  function apply(qs) {
    const q = new URLSearchParams(qs);
    for (const el of f.elements) {
      if (!el.name) continue;
      if (el.type === "checkbox") {
        el.checked = el.name === "blend" ? q.get("blend") === "1" : (q.has(el.name) ? q.get(el.name) !== "0" : checkDefaults[el.name]);
        continue;
      }
      let v = q.has(el.name) ? q.get(el.name) : (defaults[el.name] || "");
      if (el.name === "warn" || el.name === "danger") v = q.has(el.name) ? String(Math.round(+v * 100)) : defaults[el.name];
      if (el.hasAttribute("data-color") && /^([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) v = "#" + v;
      el.value = v;
      if (colorPickers[el.name]) colorPickers[el.name].value = v;
    }
    fontPicker.value = fontInput.value;
    build();
  }

  // Templates: named copies of these settings, kept in this browser.
  const TEMPLATE_KEY = "ztSetupTemplates";
  const tplSelect = document.getElementById("templates");
  function templates() {
    try { const t = JSON.parse(localStorage.getItem(TEMPLATE_KEY) || "{}"); return t && typeof t === "object" ? t : {}; } catch (e) { return {}; }
  }
  function storeTemplates(t) {
    try { localStorage.setItem(TEMPLATE_KEY, JSON.stringify(t)); return true; } catch (e) { alert("This browser couldn't save templates."); return false; }
  }
  function refreshTemplates(selected) {
    const t = templates();
    const names = Object.keys(t).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    tplSelect.textContent = "";
    const first = new Option("Templates…", "");
    tplSelect.add(first);
    tplSelect.add(new Option("Default style", "__default"));
    names.forEach((n) => tplSelect.add(new Option(n, n)));
    tplSelect.value = selected && (selected in t) ? selected : "";
    document.getElementById("deleteTemplate").disabled = !(tplSelect.value in t);
  }
  tplSelect.addEventListener("change", () => {
    const name = tplSelect.value;
    if (name === "__default") { apply(""); refreshTemplates(); return; }
    const t = templates();
    if (name in t) apply(t[name]);
    refreshTemplates(name);
  });
  document.getElementById("saveTemplate").onclick = () => {
    const current = tplSelect.value in templates() ? tplSelect.value : "";
    const name = (prompt("Template name (an existing name is replaced):", current || "My style") || "").trim();
    if (!name || name === "__default") return;
    const t = templates();
    if (name in t && name !== current && !confirm('Replace the template "' + name + '"?')) return;
    t[name] = build();
    if (storeTemplates(t)) refreshTemplates(name);
  };
  document.getElementById("deleteTemplate").onclick = () => {
    const name = tplSelect.value, t = templates();
    if (!(name in t) || !confirm('Delete the template "' + name + '"?')) return;
    delete t[name];
    if (storeTemplates(t)) refreshTemplates();
  };

  let t; f.addEventListener("input", () => { clearTimeout(t); t = setTimeout(build, 250); });
  document.getElementById("copy").onclick = async () => {
    out.select();
    try { await navigator.clipboard.writeText(out.value); } catch { document.execCommand("copy"); }
    document.getElementById("copy").textContent = "Copied";
    setTimeout(() => document.getElementById("copy").textContent = "Copy URL", 1500);
  };
  refreshTemplates();
  build();
</script>
</body>
</html>
